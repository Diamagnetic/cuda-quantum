name: Build Dev Container

on:
  push:
    branches:
      - devdeps_image
  workflow_dispatch:  # allows manual trigger from the UI

jobs:
  build-dev-container:
    runs-on: ubuntu-latest
    timeout-minutes: 398  # Matches your GitLab timeout

    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry (or replace with GitLab registry if external)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io  # Change this if you're using GitLab's registry
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Docker info
      run: docker info

    - name: Build Docker image
      run: |
        docker build -t ${{ secrets.REGISTRY_IMAGE }}/cudaq-dev -f ./docker/build/devdeps.Dockerfile .

    - name: Push Docker image
      run: |
        docker push ${{ secrets.REGISTRY_IMAGE }}/cudaq-dev
