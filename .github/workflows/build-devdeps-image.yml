name: Build Dev Container

on:
  push:
    branches:
      - devdeps_image
  workflow_dispatch:  # allows manual trigger from the UI

jobs:
  build-dev-container:
    runs-on: ubuntu-latest
    timeout-minutes: 398  # Matches your GitLab timeout

    steps:
#    - name: Checkout repository with submodules
#      uses: actions/checkout@v4
#      with:
#        submodules: recursive

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry (or replace with GitLab registry if external)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io  # Change this if you're using GitLab's registry
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Docker info
      run: docker info

    - name: To lower case
      run: |
        REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        ls $REPO_NAME

